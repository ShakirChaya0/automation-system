# ─────────────────────────────────────────────────────────────────────────────
# asistencia.yml — GitHub Actions · Sistema de Asistencia Pro
#
# Horario de cursada: 07:15 – 13:35 ART (America/Argentina/Buenos_Aires)
# ART = UTC-3, por lo tanto en UTC:
#   07:15 ART  →  10:15 UTC
#   13:35 ART  →  16:35 UTC
#
# Cron activo: */15 10-16 * * 1-5
#   → cubre 10:00–16:59 UTC = 07:00–13:59 ART  ✓
#   → antes de las 10 UTC (07:00 ART) no corre
#   → después de las 17 UTC (14:00 ART) no corre
#
# Ahorro vs. cron 24hs: de 96 ejecuciones/día → 28 ejecuciones/día (~70% menos)
# ─────────────────────────────────────────────────────────────────────────────
name: 🎓 Firmar Asistencia

on:
  schedule:
    # Lunes a Viernes, 10:00–16:59 UTC (= 07:00–13:59 ART), cada 15 minutos
    - cron: '*/15 10-16 * * 1-5'

  # Ejecución manual desde GitHub UI (útil para debug o firmas fuera de horario)
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Forzar ejecución ignorando ventana horaria'
        required: false
        default: false
        type: boolean

# ─── Permisos mínimos necesarios ─────────────────────────────────────────────
permissions:
  contents: write   # Para git push del log.json

# ─── Variables globales ───────────────────────────────────────────────────────
env:
  TZ: America/Argentina/Buenos_Aires
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  firmar-asistencia:
    name: 🤖 Bot de Asistencia
    runs-on: ubuntu-latest
    # 18 min máx: 8 min espera aleatoria + ~5 min navegación + margen
    timeout-minutes: 18

    steps:
      # ── 1. Info de contexto (muy útil para debug) ──────────────────────
      - name: 🕐 Hora y contexto de ejecución
        run: |
          echo "──────────────────────────────────────────"
          echo "  Fecha/Hora UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "  Fecha/Hora ART : $(TZ='America/Argentina/Buenos_Aires' date '+%Y-%m-%d %H:%M:%S ART')"
          echo "  Día de semana  : $(TZ='America/Argentina/Buenos_Aires' date '+%A')"
          echo "  Trigger        : ${{ github.event_name }}"
          echo "  Run ID         : ${{ github.run_id }}"
          echo "  Forzar modo    : ${{ inputs.forzar || 'false' }}"
          echo "──────────────────────────────────────────"

      # ── 2. Checkout ────────────────────────────────────────────────────
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # ── 3. Python ──────────────────────────────────────────────────────
      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # ── 4. Dependencias Python ─────────────────────────────────────────
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet
          echo "✅ Dependencias instaladas."

      # ── 5. Playwright + Chromium ───────────────────────────────────────
      - name: 🎭 Instalar Playwright y Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium
          echo "✅ Playwright + Chromium listos."

      # ── 6. Ejecutar el Bot ────────────────────────────────────────────
      - name: 🚀 Ejecutar bot de asistencia
        id: run_bot
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTIONS:   "true"
          FORZAR:           ${{ inputs.forzar || 'false' }}
        run: python bot.py
        # continue-on-error: true garantiza que el step de artefacto
        # se ejecute incluso si el bot falla
        continue-on-error: true

      # ── 7. Subir captura solo si el bot falló ─────────────────────────
      - name: 📸 Subir captura de error
        if: steps.run_bot.outcome == 'failure' && hashFiles('error.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: captura-error-${{ github.run_id }}
          path: |
            error.png
            error_*.png
          retention-days: 7
          if-no-files-found: ignore

      # ── 8. Marcar el job como fallido si el bot falló ─────────────────
      # (necesario porque usamos continue-on-error: true en el step anterior)
      - name: ❌ Propagar estado de fallo
        if: steps.run_bot.outcome == 'failure'
        run: |
          echo "::error::El bot reportó un fallo. Ver logs del step anterior y artefacto 'captura-error-${{ github.run_id }}'."
          exit 1